name: Native source release
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release-native.py'
      - 'tools/release-native-test.py'
  workflow_run:
    workflows: ['Native binding candidate']
    types: [completed]
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Successful Native binding candidate run for this exact default-branch commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-source-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publisher-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source publication identity, provenance and immutable retry guards
        run: python3 tools/release-native-test.py
  publish:
    needs: publisher-tests
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      QUALITY_RUN_ID: ${{ github.event.workflow_run.id || inputs.quality_run_id }}
    steps:
      - name: Check out the exact trusted workflow source with complete tag history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact full CI and all stable source prerequisites
        id: source
        run: python3 tools/release-native.py prepare "$RUNNER_TEMP/native-source-bundle"
      - name: Sign the five exact source evidence files with GitHub OIDC
        if: steps.source.outputs.already_published != 'true'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/native-source-bundle/*
      - name: Verify signed source identity and publish missing immutable assets
        if: steps.source.outputs.already_published != 'true'
        env:
          PROVENANCE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: >-
          python3 tools/release-native.py publish "$RUNNER_TEMP/native-source-bundle"
          --provenance "$PROVENANCE_PATH"
