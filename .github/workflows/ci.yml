name: Native binding candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Pull requests replace their in-flight run; default-branch runs are keyed by commit so none is dropped.
concurrency:
  group: binding-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-release-preparation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
      - name: Verify the toolchain policy, tooling regression suites and the reproducible source bundle
        run: |
          php tools/verify-toolchain.php
          php tools/verify-binding.php
          php tools/verify-engine.php
          php tools/release-source-test.php
          php tools/test-sync-engine.php
          php tools/test-release-gate.php
          php tools/test-diagnostic-attribution.php
          php tools/benchmark-runtime-test.php
          php tools/release-source.php prepare "$RUNNER_TEMP/source-release"
          php tools/release-source.php verify "$RUNNER_TEMP/source-release" --expected-commit "$(git rev-parse HEAD)"
          php tools/release-notes.php "$RUNNER_TEMP/source-release" > "$RUNNER_TEMP/source-release/RELEASE-NOTES.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/source-release
  binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          extensions: ctype, tokenizer, phar, fileinfo, iconv, mbstring, intl, curl, dom, simplexml, xml, xmlreader, xmlwriter, zip, pdo, sodium
          tools: composer:v2
      - name: Install package-attributable PHP diagnostic host
        run: |
          # setup-php uses extracted php-builder binaries for PHP 8.5. They do
          # not have dpkg ownership, so install the actual distro packages
          # before compiling the binding against this captured runtime.
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install --yes --reinstall \
            php8.5-cli php8.5-common php8.5-dev php8.5-mbstring \
            php8.5-intl php8.5-curl php8.5-xml php8.5-zip
          sudo update-alternatives --set php /usr/bin/php8.5
          sudo update-alternatives --set phpize /usr/bin/phpize8.5
          sudo update-alternatives --set php-config /usr/bin/php-config8.5
          dpkg-query --search /usr/bin/php8.5
          php -n -v
          test "$(php -n -r 'echo PHP_VERSION;')" = "$(php-config --version)"
      - name: Verify diagnostic attribution and refusal regression tests
        run: php tools/test-diagnostic-attribution.php
      - name: Verify committed source, embedded Engine and generated API
        run: |
          composer validate --strict
          php tools/verify-toolchain.php
          php tools/generate-arginfo.php --check
          php tools/verify-binding.php
          php tools/verify-engine.php
      - name: Execute the complete native Engine suite
        run: |
          cmake -S vendor/engine -B "$RUNNER_TEMP/native-tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/native-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/native-tests" --output-on-failure
      - name: Build actual PHP extension
        run: |
          phpize
          ./configure --enable-kumwe_engine
          make -j2
          php tools/verify-native-linkage.php
      - name: Record independent source and standalone Engine CLI compatibility
        run: |
          php tools/expected-tuple.php > candidate-compatibility.json
          cmake --build engine-build --target kumwe-engine-conformance --parallel 2
          engine-build/kumwe-engine-conformance --capabilities > engine-cli-capabilities.json
          php -n tools/verify-cli-tuple.php
      - name: Execute PHPT and corpus parity
        env:
          NO_INTERACTION: '1'
          REPORT_EXIT_STATUS: '1'
        run: make test TESTS='tests' TEST_PHP_ARGS='-q'
      - name: Refuse a mismatched actual PHP patch at module startup
        run: bash tools/test-php-patch-guard.sh
      - name: Native allocation lifecycle under Valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          USE_ZEND_ALLOC=0 valgrind --error-exitcode=97 --leak-check=full --errors-for-leak-kinds=definite php -n -d extension="$PWD/modules/kumwe_engine.so" tools/lifecycle.php
      - name: Record tested tuple
        run: php -n -d extension="$PWD/modules/kumwe_engine.so" tools/consumer.php > candidate-tuple.json
      - name: Capture and verify a relocatable diagnostic PHP runtime
        run: |
          php tools/diagnostic-runtime.php self-test
          php tools/diagnostic-runtime.php capture "$RUNNER_TEMP/diagnostic-capture" --module "$PWD/modules/kumwe_engine.so"
          mv "$RUNNER_TEMP/diagnostic-capture" "$RUNNER_TEMP/diagnostic runtime"
          fixture="$RUNNER_TEMP/diagnostic runtime"
          # Simulate ZIP's normalized modes before explicit verified activation.
          find "$fixture" -type f -exec chmod 0644 {} +
          php tools/diagnostic-runtime.php verify "$fixture" --expected-commit "$(git rev-parse HEAD)"
          php tools/diagnostic-runtime.php verify "$fixture" --expected-commit "$(git rev-parse HEAD)" --activate
          "$fixture/bin/php" -r '
            $record = json_decode(file_get_contents($argv[1]), true, 64, JSON_THROW_ON_ERROR);
            foreach ($record["required_extensions"] as $name) {
                if (!extension_loaded($name)) { throw new RuntimeException("Missing captured PHP extension: " . $name); }
            }
            if (PHP_VERSION !== $record["php"]["version"] || extension_loaded("kumwe_engine")) {
                throw new RuntimeException("Diagnostic PHP version/default-module mismatch.");
            }
            echo "Captured PHP and all required extensions loaded without native defaults.\n";
          ' "$fixture/fixture.json"
          "$fixture/bin/php" -d extension="$PWD/modules/kumwe_engine.so" tools/consumer.php > diagnostic-runtime-consumer.json
          php tools/verify-workflow.php json-equal candidate-tuple.json diagnostic-runtime-consumer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-runtime
          path: ${{ runner.temp }}/diagnostic runtime
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: binding-evidence
          path: |
            candidate-tuple.json
            diagnostic-runtime-consumer.json
            candidate-compatibility.json
            engine-cli-capabilities.json
            build-identity.json
            resources/engine-lock.json
            modules/kumwe_engine.so
            tests/*.diff
            tests/*.out
            config.log
  binding-zts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
        env:
          phpts: ts
      - name: Require a thread-safe PHP host
        run: |
          php -v
          php -r 'exit(PHP_ZTS ? 0 : 1);'
          test "$(php -r 'echo PHP_VERSION;')" = "$(php-config --version)"
      - name: Build the extension against thread-safe PHP
        run: |
          php tools/verify-engine.php
          phpize
          ./configure --enable-kumwe_engine
          make -j2
          php tools/verify-native-linkage.php
          php -n -d extension="$PWD/modules/kumwe_engine.so" -r 'echo json_encode(["zts" => PHP_ZTS, "thread_model" => (new Kumwe\Engine\Runtime())->capabilities()["binding_build"]["thread_model"]]), "\n";'
      - name: Execute PHPT, corpus parity and the native allocation lifecycle on ZTS
        run: |
          make test TESTS='tests' TEST_PHP_ARGS='-q'
          php -n -d extension="$PWD/modules/kumwe_engine.so" tools/consumer.php > zts-tuple.json
          php -n -d extension="$PWD/modules/kumwe_engine.so" tools/lifecycle.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zts-evidence
          path: |
            zts-tuple.json
            build-identity.json
            tests/*.diff
            tests/*.out
            config.log
  address-undefined-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      USE_ZEND_ALLOC: '0'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      NO_INTERACTION: '1'
      REPORT_EXIT_STATUS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out exact PHP 8.5.10 sanitizer host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: php/php-src
          ref: 34308a6666b2d489c509541ea9befea9e2b42348
          path: sanitizer-php-source
      - name: Install source build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf bison re2c pkg-config
          clang --version
      - name: Build actual instrumented PHP executable and development headers
        working-directory: sanitizer-php-source
        env:
          # The C PHP host must export the C++ sanitizer handlers used by Engine.
          LDFLAGS: -fsanitize-link-c++-runtime
          LIBS: -lstdc++
        run: |
          ./buildconf --force
          ./configure --prefix="$RUNNER_TEMP/kumwe-sanitized-php" \
            --disable-all --enable-cli --disable-cgi --disable-phpdbg --without-pear \
            --enable-debug --enable-address-sanitizer --enable-undefined-sanitizer
          make -j2
          make install
          "$RUNNER_TEMP/kumwe-sanitized-php/bin/php" -n -v
          nm -D "$RUNNER_TEMP/kumwe-sanitized-php/bin/php" | grep '__ubsan_vptr_type_cache$'
          echo "$RUNNER_TEMP/kumwe-sanitized-php/bin" >> "$GITHUB_PATH"
      - name: Build instrumented Zend binding and complete embedded Engine
        env:
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
          CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: |
          php -n tools/verify-engine.php
          phpize
          ./configure --enable-kumwe_engine --with-php-config="$RUNNER_TEMP/kumwe-sanitized-php/bin/php-config"
          make -j2
          php -n -d extension="$PWD/modules/kumwe_engine.so" tools/consumer.php
      - name: Execute public PHPT corpora and native allocation lifecycle
        run: |
          make test TESTS='tests' TEST_PHP_ARGS='-q'
          php -n -d extension="$PWD/modules/kumwe_engine.so" tools/lifecycle.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: address-undefined-sanitizer-evidence
          path: |
            tests/*.diff
            tests/*.out
            config.log
            engine-build/CMakeCache.txt
            build-identity.json
            sanitizer-php-source/config.log
  clean-pie:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: pie:1.4.10
      - name: Verify exact PIE installer identity
        run: |
          pie_path="$(readlink -f "$(command -v pie)")"
          echo "b88792235c8e80be568436d4cb043b49fd1869c89b64e83d23e2882ae19d70a8  $pie_path" | sha256sum --check
          mkdir "$RUNNER_TEMP/pie-evidence"
          pie --version | tee "$RUNNER_TEMP/pie-evidence/version.txt"
          sha256sum "$pie_path" > "$RUNNER_TEMP/pie-evidence/installer.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/pie-evidence/source-commit.txt"
      - name: Extract exact committed source archive
        run: |
          mkdir "$RUNNER_TEMP/kumwe-pie-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/kumwe-pie-source"
      - name: PIE install with networking disabled
        run: |
          cd "$RUNNER_TEMP/kumwe-pie-source"
          sudo unshare --net -- env PATH="$PATH" COMPOSER_DISABLE_NETWORK=1 KUMWE_PIE_PATH="$(command -v pie)" bash tools/offline-install.sh
          php tools/consumer.php > "$RUNNER_TEMP/pie-evidence/consumer-tuple.json"
          cp build-identity.json "$RUNNER_TEMP/pie-evidence/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-pie-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pie-evidence
          if-no-files-found: error
  whole-boundary-benchmarks:
    needs: binding
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostic-runtime
          path: ${{ runner.temp }}/diagnostic-runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: binding-evidence
          path: ${{ runner.temp }}/binding-evidence
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
      - name: Verify the captured PHP, the embedded Engine and the independently recorded module tuple
        run: |
          php tools/verify-engine.php
          php tools/diagnostic-runtime.php verify "$RUNNER_TEMP/diagnostic-runtime" \
            --expected-commit "$(git rev-parse HEAD)" --activate
          php tools/verify-workflow.php module "$RUNNER_TEMP/diagnostic-runtime/fixture.json" "$RUNNER_TEMP/binding-evidence/modules/kumwe_engine.so"
          cp "$RUNNER_TEMP/binding-evidence/build-identity.json" build-identity.json
          fixture="$RUNNER_TEMP/diagnostic-runtime/bin/php"
          "$fixture" -d extension="$RUNNER_TEMP/binding-evidence/modules/kumwe_engine.so" \
            tools/consumer.php > "$RUNNER_TEMP/benchmark-consumer.json"
          php tools/verify-workflow.php json-equal "$RUNNER_TEMP/benchmark-consumer.json" "$RUNNER_TEMP/binding-evidence/candidate-tuple.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kumwe/app
          ref: 24ecf956423c18933e824b43cea1bfb9127a79a9
          path: benchmark-sources/app
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kumwe/extension-sdk
          ref: d0484b8733eaa57d076f567ffa5e997b9564b5fa
          path: benchmark-sources/sdk
      - name: Install the frozen oracle dependencies
        run: |
          curl --fail --silent --show-error --location \
            https://getcomposer.org/download/2.10.3/composer.phar -o "$RUNNER_TEMP/composer.phar"
          printf '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  %s\n' \
            "$RUNNER_TEMP/composer.phar" | sha256sum --check --strict
          "$RUNNER_TEMP/diagnostic-runtime/bin/php" "$RUNNER_TEMP/composer.phar" \
            install --working-dir=tests/benchmark --no-dev --no-interaction --prefer-dist --no-plugins --no-scripts
      - name: Measure complete calls, exact parity, allocations and synthetic saturation
        run: |
          # The 4096-document oracle exceeds the distro's 128MiB CLI default.
          # Apply the same finite benchmark budget to both measured backends.
          cat > "$RUNNER_TEMP/benchmark-php" <<'SH'
          #!/usr/bin/env bash
          exec "$RUNNER_TEMP/diagnostic-runtime/bin/php" -d memory_limit=1G -d display_errors=stderr "$@"
          SH
          chmod +x "$RUNNER_TEMP/benchmark-php"
          php -d memory_limit=2G tools/benchmark-runtime.php \
            --diagnostic-runtime "$RUNNER_TEMP/diagnostic-runtime" \
            --php "$RUNNER_TEMP/benchmark-php" \
            --extension "$RUNNER_TEMP/binding-evidence/modules/kumwe_engine.so" \
            --app "$PWD/benchmark-sources/app" --sdk "$PWD/benchmark-sources/sdk" \
            --autoload "$PWD/tests/benchmark/vendor/autoload.php" \
            --output "$RUNNER_TEMP/whole-boundary-performance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: whole-boundary-performance
          path: |
            ${{ runner.temp }}/whole-boundary-performance
            ${{ runner.temp }}/benchmark-consumer.json
            tests/benchmark/composer.lock
  release:
    name: Publish source release
    needs: [source-release-preparation, binding, binding-zts, address-undefined-sanitizers, clean-pie, whole-boundary-benchmarks]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: binding-source-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: ${{ vars.KUMWE_RELEASE_AUTHOR_NAME || 'Lemuel' }}
      GIT_AUTHOR_EMAIL: ${{ vars.KUMWE_RELEASE_AUTHOR_EMAIL || 'lemuel@vdm.to' }}
      ENGINE_DISPATCH_TOKEN: ${{ secrets.KUMWE_ENGINE_DISPATCH_TOKEN }}
      # The release tooling always comes from the commit that triggered this run; the source being released
      # is checked out separately, because a tag whose release is missing is completed from its own commit.
      KUMWE_ROOT: ${{ github.workspace }}/release-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
      - name: Decide what this run releases under the hard-linked Engine version
        id: gate
        run: php tools/release-gate.php
      - name: Request the next Engine patch release for a binding-only change
        if: steps.gate.outputs.engine_bump == 'true'
        run: |
          if [ -z "$ENGINE_DISPATCH_TOKEN" ]; then
            echo '::error::Repository secret KUMWE_ENGINE_DISPATCH_TOKEN is not set. Create a fine-grained token with Actions: read and write on kumwe/engine and add it as that secret; this change is published under the next Engine release once that request can be sent.'
            exit 1
          fi
          export GH_TOKEN="$ENGINE_DISPATCH_TOKEN"
          latest="$(gh release view --repo kumwe/engine --json tagName --jq .tagName)"
          if [ "$latest" != '${{ steps.gate.outputs.engine_release }}' ]; then
            echo "::notice::Engine $latest is published and not embedded yet; the Engine sync carries this change, so no further release is requested."
            exit 0
          fi
          pending="$(gh run list --repo kumwe/engine --workflow ci.yml --event workflow_dispatch --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$pending" != "0" ]; then
            echo "::notice::An Engine run started by request is already pending; its release carries this change."
            exit 0
          fi
          gh workflow run ci.yml --repo kumwe/engine --ref main -f bump=true
          echo "::notice::Requested the next Engine patch release; its sync embeds it here and a green run publishes this change under that version."
      - name: Check out the commit being released
        if: steps.gate.outputs.release == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.gate.outputs.sha }}
          path: release-source
          fetch-depth: 0
      - name: Assemble the reproducible source bundle for the released commit
        if: steps.gate.outputs.release == 'true'
        run: |
          php tools/release-source.php prepare "$RUNNER_TEMP/release"
          php tools/release-source.php verify "$RUNNER_TEMP/release" --expected-commit '${{ steps.gate.outputs.sha }}'
          test "$(php -r 'echo json_decode(file_get_contents($argv[1]), true)["version"];' "$RUNNER_TEMP/release/source.json")" = '${{ steps.gate.outputs.version }}'
      - name: Attest GitHub OIDC build provenance for the source bundle
        if: steps.gate.outputs.release == 'true'
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/kumwe-engine-php-source.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/source.json
            ${{ runner.temp }}/release/source.spdx.json
      - name: Tag the tested commit and publish the immutable release
        if: steps.gate.outputs.release == 'true'
        run: |
          status=0
          bash tools/release-publish.sh "$RUNNER_TEMP/release" "${{ steps.provenance.outputs.bundle-path }}" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::notice::${{ steps.gate.outputs.tag }} was published from another commit first; the next run on the default branch evaluates this commit again."
            gh workflow run ci.yml --ref '${{ github.event.repository.default_branch }}'
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          if [ '${{ steps.gate.outputs.followup }}' = 'true' ]; then
            # This run completed an older tag's missing release; the default-branch tip is evaluated afresh.
            gh workflow run ci.yml --ref '${{ github.event.repository.default_branch }}'
            echo "::notice::Started a follow-up run on ${{ github.event.repository.default_branch }} to evaluate its tip now that ${{ steps.gate.outputs.tag }} is published."
          fi
